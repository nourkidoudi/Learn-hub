events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # HMR Vite
        location /@vite/client {
            proxy_pass http://learning-frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /@fs/ {
            proxy_pass http://learning-frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /node_modules/ {
            proxy_pass http://learning-frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Rediriger le trafic racine vers le frontend
        location / {
            proxy_pass http://learning-frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Rediriger /api/users vers user-service
        location /api/users/ {
            proxy_pass http://user-service:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rediriger /api/auth vers user-service
        location /api/auth/ {
            proxy_pass http://user-service:3001/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rediriger /api/courses vers course-service
        location /api/courses/ {
            proxy_pass http://course-service:8000/courses/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rediriger /api/lessons vers course-service
        location /api/lessons/ {
            proxy_pass http://course-service:8000/lessons/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # Rediriger /api/analytics vers analytics-service
        location /api/analytics/ {
            proxy_pass http://analytics-service:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rediriger /api/tutor vers ai-tutor-service
        location /api/tutor/ {
            proxy_pass http://ai-tutor-service:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Configuration spécifique pour le streaming (Server-Sent Events)
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}