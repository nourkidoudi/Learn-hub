# version: '3.8' (obsolete)

services:
  nginx-gateway:
    container_name: learnhub-nginx-gateway
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - learning-frontend
      - user-service
      - course-service
    networks:
      - devops-network

  learning-frontend:
    container_name: learnhub-learning-frontend
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - devops-network

  user-service:
    container_name: learnhub-user-service
    build:
      context: ./services/user-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/users
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - PORT=3001
    depends_on:
      - mongodb
    networks:
      - devops-network

  course-service:
    container_name: learnhub-course-service
    build:
      context: ./services/course-service
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-courses}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-supersecret}
    volumes:
      - ./services/course-service:/app
    depends_on:
      - postgres
      - redis
    networks:
      - devops-network

  analytics-service:
    container_name: learnhub-analytics-service
    build:
      context: ./services/analytics-service
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-courses}
    volumes:
      - ./services/analytics-service:/app
    depends_on:
      - postgres
    networks:
      - devops-network

  ai-tutor-service:
    container_name: learnhub-ai-tutor-service
    build:
      context: ./services/ai-tutor-service
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=tinyllama
    volumes:
      - ./services/ai-tutor-service:/app
    depends_on:
      - ollama
    networks:
      - devops-network

  n8n-automation:
    container_name: learnhub-n8n-automation
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - devops-network

  postgres:
    container_name: learnhub-postgres
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-courses}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops-network

  mongodb:
    container_name: learnhub-mongodb
    image: mongo:6
    volumes:
      - mongodb_data:/data/db
    networks:
      - devops-network

  redis:
    container_name: learnhub-redis
    image: redis:alpine
    networks:
      - devops-network

  minio:
    container_name: learnhub-minio
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    networks:
      - devops-network

  ollama:
    container_name: learnhub-ollama
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  n8n_data:
  minio_data:
  ollama_data:
