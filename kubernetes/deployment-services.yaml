apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: nourki2003/learnhub-user-service:latest
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/users"
            - name: JWT_SECRET
              value: "supersecret"
            - name: PORT
              value: "3001"
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
spec:
  ports:
    - port: 3001
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: default
  labels:
    app: course-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
        - name: course-service
          image: nourki2003/learnhub-course-service:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/courses"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: JWT_SECRET
              value: "supersecret"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: default
spec:
  ports:
    - port: 8000
  selector:
    app: course-service
---
